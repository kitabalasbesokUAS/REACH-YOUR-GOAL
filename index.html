<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach Your Goal</title>
    
    <!-- CSS: UNTUK DESAIN TAMPILAN WEB -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #bed9f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #fefdd0;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid #ede986;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #4b0404;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #ede986;
            background-color: #4b0404;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #4b0404;
        }

        /* Tampilan Riwayat / Daftar Barang */
        .riwayat-section {
            margin-top: 30px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 20px;
        }

        .riwayat-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .item-card {
            background-color: #fffabf;
            border: 1px solid #4b0404;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info h4 {
            font-size: 15px;
            color: #4b0404;
        }

        .item-info p {
            font-size: 13px;
            color: #4b0404;
        }

        .item-badge {
            background-color: #4b0404;
            color: #fffabf;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .total-box {
            background-color: #fffabf;
            border: 1px solid #ede986;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #4b0404;
        }

        .total-box h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .error-msg {
            color: #dc2626;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER WEB -->
        <div class="header">
            <h1>≽^• ˕ • ྀི≼ REACH YOUR GOAL ≽^• ˕ • ྀི≼</h1>
            <p>Hitung estimasi waktu menabung untuk barang impian!</p>
        </div>

        <!-- FORM INPUT KEUNAGAN & BARANG -->
        <div class="form-group">
            <label for="saku">Uang Saku Harian (Rp)</label>
            <input type="number" id="saku" placeholder="Contoh: 20000">
        </div>

        <div class="form-group">
            <label for="jajan">Jajan Harian (Rp)</label>
            <input type="number" id="jajan" placeholder="Contoh: 15000">
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <div class="form-group">
            <label for="nama">Nama Barang Impian</label>
            <input type="text" id="nama" placeholder="Contoh: Sepatu Baru">
        </div>

        <div class="form-group">
            <label for="harga">Harga Barang (Rp)</label>
            <input type="number" id="harga" placeholder="Contoh: 500000">
        </div>

        <button class="btn-submit" onclick="tambahBarang()">+ Hitung & Tambah Barang</button>
        <div id="errorMsg" class="error-msg"></div>

        <!-- DAFTAR BARANG YANG SUDAH DIINPUT (TIDAK HILANG) -->
        <div class="riwayat-section" id="riwayatSection" style="display: none;">
            <div class="riwayat-title">Daftar Barang Impianmu:</div>
            <div id="daftarBarang"></div>
            
            <div id="totalBox" class="total-box"></div>
        </div>
    </div>

    <!-- JAVASCRIPT: LOGIKA PERHITUNGAN PROGRAM -->
    <script>
        // Array untuk menyimpan riwayat barang (supaya barang lama tidak hilang)
        let dataBarang = [];

        function tambahBarang() {
            let saku = parseFloat(document.getElementById('saku').value);
            let jajan = parseFloat(document.getElementById('jajan').value);
            let nama = document.getElementById('nama').value.trim();
            let harga = parseFloat(document.getElementById('harga').value);
            let errorMsg = document.getElementById('errorMsg');

            // Validasi Input
            if (isNaN(saku) || isNaN(jajan) || !nama || isNaN(harga)) {
                errorMsg.innerText = " Harap isi semua kolom data dengan benar!";
                errorMsg.style.display = "block";
                return;
            }

            let tabunganHarian = saku - jajan;

            if (tabunganHarian <= 0) {
                errorMsg.innerText = " (╥﹏╥) Uang saku habis/kurang buat jajan! Coba kurangi pengeluaran.";
                errorMsg.style.display = "block";
                return;
            }

            errorMsg.style.display = "none";

            // Perhitungan Hari
            let hari = Math.ceil(harga / tabunganHarian);

            // Simpan Barang Baru ke Array
            dataBarang.push({
                nama: nama,
                harga: harga,
                hari: hari
            });

            // Bersihkan kolom input barang agar bisa diisi barang kedua/selanjutnya
            document.getElementById('nama').value = "";
            document.getElementById('harga').value = "";

            // Tampilkan Hasil
            tampilkanDaftar();
        }

        function tampilkanDaftar() {
            let riwayatSection = document.getElementById('riwayatSection');
            let daftarBarangDiv = document.getElementById('daftarBarang');
            let totalBoxDiv = document.getElementById('totalBox');

            riwayatSection.style.display = "block";
            daftarBarangDiv.innerHTML = "";

            let totalHari = 0;
            let totalBiaya = 0;

            // Render setiap barang ke tampilan HTML
            dataBarang.forEach((item, index) => {
                totalHari += item.hari;
                totalBiaya += item.harga;

                daftarBarangDiv.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <h4>${index + 1}. ${item.nama}</h4>
                            <p>Rp ${item.harga.toLocaleString('id-ID')}</p>
                        </div>
                        <div class="item-badge">${item.hari} Hari</div>
                    </div>
                `;
            });

            // Hitung Estimasi Total
            let estimasiBulan = (totalHari / 30).toFixed(1);
            totalBoxDiv.innerHTML = `
                <h3>Total Keseluruhan:</h3>
                <p><b>Total Biaya:</b> Rp ${totalBiaya.toLocaleString('id-ID')}</p>
                <p><b>Total Waktu:</b> ${totalHari} Hari (~${estimasiBulan} Bulan)</p>
            `;
        }
    </script>
</body>
</html>
